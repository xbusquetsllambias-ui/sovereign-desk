<style>

main{padding:0 16px}
.ey{font:11px var(--fm);letter-spacing:.16em;color:var(--gd);text-transform:uppercase;margin:22px 0 6px}

.cd{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-top:12px;min-width:0}

.m{font-family:var(--fm);font-variant-numeric:tabular-nums}
.k{font:10.5px var(--fm);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}

ul.cn{list-style:none;margin:10px 0 0;padding:0}ul.cn li{display:flex;gap:8px;font-size:13.5px;padding:3px 0}

.buy{font-size:14px;margin-top:10px}
.lnk{background:none;border:0;color:var(--ac);font:14px var(--fb);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
a{color:var(--ac)}
details.flt{margin-top:14px;background:var(--cd);border:1px solid var(--ln);border-radius:10px}
details.flt summary{padding:11px 14px;cursor:pointer;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.flt summary::-webkit-details-marker{display:none}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.fg label{display:flex;flex-direction:column;gap:4px;font:10.5px var(--fm);letter-spacing:.1em;color:var(--mut);text-transform:uppercase;min-width:0}
.fg .full{grid-column:1/-1}

.fb{display:flex;gap:10px;grid-column:1/-1}
.btn{background:var(--gd);color:#14110A;border:0;border-radius:7px;padding:9px 14px;font:500 14px var(--fb);cursor:pointer}
.btn.g{background:none;border:1px solid var(--ln);color:var(--ink)}
.nw .sum{margin-top:8px;font-size:14px;white-space:pre-wrap}
.nw details summary{cursor:pointer;color:var(--ac);font-size:14px;margin-top:8px}
.cnt{margin-top:12px;color:var(--mut);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0D1430;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .w{display:flex;max-width:640px}
.bar button{flex:1;background:none;border:0;border-top:2px solid transparent;color:var(--mut);font:11px var(--fb);padding:9px 0 11px;cursor:pointer;min-width:0}
.bar button.on{color:var(--ac);border-top-color:var(--ac)}

.mt p{margin:10px 0}.mt ul{padding-left:20px;margin:8px 0}.mt li{margin:4px 0;font-size:14.5px}
.tm{margin-top:10px;border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;font-size:14px;border:1px solid}
.tm .tx{display:flex;flex-direction:column;gap:3px;min-width:0}.tm b{font-size:14.5px}
.tm.g{border-color:var(--up);background:#0F2A22}.tm.a{border-color:#F2B84B;background:#2A230F}.tm.r{border-color:var(--dn);background:#2E1519}
.sem{display:flex;flex-direction:column;gap:4px;background:#05080F;border-radius:8px;padding:5px;flex:none}
.sem i{width:12px;height:12px;border-radius:50%;display:block;background:#1F2638}
.tm.g .sem i:nth-child(1).on{background:#3DDC97;box-shadow:0 0 8px #3DDC97}.tm.a .sem i:nth-child(2).on{background:#F2B84B;box-shadow:0 0 8px #F2B84B}.tm.r .sem i:nth-child(3).on{background:#FF7A7A;box-shadow:0 0 8px #FF7A7A}
.foot{margin:26px 0 10px;color:var(--mut);font-size:12px}

};

const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],MEN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fd=d=>{if(!d)return"—";const[y,m,dd]=String(d).slice(0,10).split("-").map(Number);return L==="es"?`${dd} ${MES[m-1]} ${y}`:`${MEN[m-1]} ${dd}, ${y}`};

const HOL=new Set(["2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25","2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25","2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31","2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24","2028-01-17","2028-02-21","2028-04-14","2028-05-29","2028-06-19","2028-07-04","2028-09-04","2028-11-23","2028-12-25"]);
const EARLY=new Set(["2026-11-27","2026-12-24","2027-11-26","2028-07-03","2028-11-24"]);
const isOpen=d=>{const w=new Date(d+"T12:00:00Z").getUTCDay();return w!==0&&w!==6&&!HOL.has(d)};
const addD=(d,n)=>new Date(new Date(d+"T12:00:00Z").getTime()+n*864e5).toISOString().slice(0,10);

function sessionsLate(entry){const n=nyNow();let last=n.d;const close=EARLY.has(n.d)?"13:00":"16:00";
 if(!isOpen(last)||n.t<close){last=addD(last,-1);while(!isOpen(last))last=addD(last,-1)}
 let k=0,x=entry;while(x<last){x=addD(x,1);if(isOpen(x))k++}return last>=entry?k+1:0}
function sessionsLeft(exit){const n=nyNow();let k=0,x=n.d;while(x<exit){x=addD(x,1);if(isOpen(x))k++}return k}

 const late=sessionsLate(o.entry_date),left=sessionsLeft(o.exit_date),n=nyNow();

 const s=L==="es"?n.summary_es:n.summary_en;
 return `<div class="cd nw"><div class="row"><div><span class="code">${esc(n.code)}</span> · <b>${esc(n.ticker)}</b> <span class="nm">${esc(n.name||"")}</span></div><span class="badge">${esc(n.form)}</span></div>
 <div style="margin-top:6px">${esc(L==="es"?n.motivo_es:n.motivo_en)}</div><div class="mut sm m">${fd(n.filed)}</div>
 ${s?`<details><summary>${t("sum")}</summary><div class="sum">${esc(s)}</div></details>`:`<div class="mut sm" style="margin-top:8px">${t("sumPend")}</div>`}
 <div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap"><a href="${esc(n.url)}" target="_blank" rel="noopener">${t("doc")} ↗</a><button class="lnk" data-opp="${esc(n.code)}" data-st="${esc(n.estado)}">${t("seeOpp")} ${esc(n.code)} (${t(n.estado==="cerrada"?"closed":"open")})</button></div></div>`;
}
const enc=encodeURIComponent;
async function render(){
 const{tab,f}=parseHash();drawTabs(tab);const app=document.getElementById("app");
 if(tab==="metodo"){app.innerHTML=metodo();return}
 const ttl={abiertas:["tA","dA"],cerradas:["tB","dB"],noticias:["tC","dC"]}[tab];
 app.innerHTML=`<div class="ey">${t("eyA")}</div><h1>${t(ttl[0])}</h1><p class="mut">${t(ttl[1])}</p>${filterForm(tab,f)}<div id="list"><p class="mut">${t("load")}</p></div><p class="foot">${t("legal")}</p>`;
 bindForm(tab);const list=document.getElementById("list");
 try{
  if(tab!=="noticias"){
   let q=`public_opportunities?select=code,ticker,name,level,entry_date,exit_date,published_at,estado,n_news&estado=eq.${tab==="abiertas"?"abierta":"cerrada"}&order=${tab==="abiertas"?"published_at.desc":"exit_date.desc"}&limit=300`;
   if(f.code)q+=`&code=eq.${enc(f.code)}`;if(f.ticker)q+=`&ticker=ilike.*${enc(f.ticker)}*`;if(f.level)q+=`&level=eq.${enc(f.level)}`;
   if(f.pf)q+=`&published_at=gte.${enc(f.pf)}`;if(f.pt)q+=`&published_at=lt.${enc(nextDay(f.pt))}`;
   if(f.cf)q+=`&exit_date=gte.${enc(f.cf)}`;if(f.ct)q+=`&exit_date=lte.${enc(f.ct)}`;
   const rows=await get(q);const anyF=Object.values(f).some(Boolean);
   list.innerHTML=rows.length?`<div class="cnt">${rows.length} ${t("res")}</div>`+rows.map(oppCard).join(""):`<div class="cd mut">${t(anyF?"none":"noneYet")}</div>`;
  }else{
   let q=`public_news?select=id,code,ticker,name,form,items,filed,url,motivo_es,motivo_en,summary_es,summary_en,estado&order=filed.desc,id.desc&limit=300`;
   if(f.code)q+=`&code=eq.${enc(f.code)}`;if(f.ticker)q+=`&ticker=ilike.*${enc(f.ticker)}*`;
   if(f.df)q+=`&filed=gte.${enc(f.df)}`;if(f.dt)q+=`&filed=lte.${enc(f.dt)}`;
   if(f.q)q+=L==="es"?`&tsv_es=wfts(spanish).${enc(f.q)}`:`&tsv_en=wfts(english).${enc(f.q)}`;
   const rows=await get(q);
   list.innerHTML=rows.length?`<div class="cnt">${rows.length} ${t("res")}</div>`+rows.map(newsCard).join(""):`<div class="cd mut">${t("noneN")}</div>`;
  }
  list.querySelectorAll("[data-news]").forEach(b=>b.onclick=()=>go("noticias",{code:b.dataset.news}));
  list.querySelectorAll("[data-opp]").forEach(b=>b.onclick=()=>go(b.dataset.st==="cerrada"?"cerradas":"abiertas",{code:b.dataset.opp}));
 }catch(e){list.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
const nextDay=d=>new Date(new Date(d+"T12:00:00Z").getTime()+864e5).toISOString().slice(0,10);
function metodo(){
 const es=L==="es";
 const card=(h,p)=>`<div class="cd"><h3>${h}</h3>${p}</div>`;
 return `<div class="ey">${t("eyA")}</div><h1>${es?"Cómo funciona":"How it works"}</h1><div class="mt">
 <p class="mut">${es?"Oportunidades de inversión en bolsa de Estados Unidos, detectadas a partir de información pública y oficial, explicadas de forma sencilla.":"US stock market opportunities, detected from public, official information and explained in plain language."}</p>
 ${card(es?"Datos oficiales, no rumores":"Official data, not rumours",`<p>${es?"Cada día leemos de forma automática la información que las empresas cotizadas están obligadas a comunicar a la <b>SEC</b>, el supervisor de la bolsa de Estados Unidos, junto con datos de mercado publicados por la <b>Reserva Federal</b> (FRED). Son fuentes públicas y verificables: cada oportunidad enlaza al documento original.":"Every day we automatically read the information that listed companies are required to file with the <b>SEC</b>, the US stock market regulator, together with market data published by the <b>Federal Reserve</b> (FRED). These are public, verifiable sources: every opportunity links to the original filing."}</p>`)}
 ${card(es?"Un sistema que filtra el ruido":"A system that filters out the noise",`<p>${es?"Cada día se publican miles de documentos. Nuestro sistema, construido y probado con años de datos históricos, los analiza y descarta la gran mayoría. Solo se queda con los pocos casos que reúnen las señales que buscamos y los clasifica en <b>cinco niveles</b>. Aquí solo ves los dos más altos, <b>convicción alta</b> y <b>convicción máxima</b>: los únicos que en nuestras simulaciones con años de datos históricos han mostrado ventaja, sometidos a pruebas estrictas para distinguir un buen resultado de la pura suerte.":"Thousands of filings are published every day. Our system, built and tested on years of historical data, analyses them and discards the vast majority. It keeps only the few cases that bring together the signals we look for and ranks them on <b>five levels</b>. Here you only see the top two, <b>high</b> and <b>highest conviction</b>: the only ones that showed an edge in our simulations over years of historical data, put through strict tests to tell a real result from pure luck."}</p>`)}
 ${card(es?"Qué ves en cada oportunidad":"What each opportunity shows",`<ul>
 <li>${es?"<b>La empresa</b> y su nivel de convicción.":"<b>The company</b> and its conviction level."}</li>
 <li>${es?"<b>Cuándo entrar:</b> el día de la oportunidad y un <b>semáforo</b>. Verde: buen momento. Ámbar: todavía se puede, con menos recorrido. Rojo: ya no compensa. Lo calculamos con nuestras simulaciones de entradas con retraso.":"<b>When to enter:</b> the opportunity date and a <b>traffic light</b>. Green: good time. Amber: still possible, with less upside. Red: no longer worth it. Based on our simulations of late entries."}</li>
 <li>${es?"<b>Cuándo termina:</b> la fecha de cierre prevista. Son oportunidades de pocos días o pocas semanas.":"<b>When it ends:</b> the planned closing date. These are opportunities of a few days or a few weeks."}</li>
 <li>${es?"<b>Las noticias oficiales</b> de la empresa, resumidas en español y en inglés por inteligencia artificial, con el enlace al documento original.":"<b>The company's official news</b>, summarised in Spanish and English by artificial intelligence, with a link to the original filing."}</li></ul>`)}
 ${card(es?"Transparente y sin retoques":"Transparent and unedited",`<p>${es?"Cada oportunidad recibe un código y una fecha en el momento de publicarse, y no se puede modificar ni borrar después. Los resultados de las simulaciones son históricos: no garantizan resultados futuros. Las cerradas siguen visibles en su pestaña: lo que ves es exactamente lo que se publicó.":"Each opportunity gets a code and a date when it is published, and cannot be changed or deleted afterwards. Simulation results are historical: they do not guarantee future results. Closed ones remain visible in their tab: what you see is exactly what was published."}</p>`)}
 ${card(es?"Importante":"Important",`<p>${es?"Esto es información, no una recomendación de inversión personalizada. Invertir en bolsa tiene riesgo y puedes perder dinero: decide siempre según tu situación y, si lo necesitas, consulta a un profesional.":"This is information, not personalised investment advice. Investing in stocks carries risk and you can lose money: always decide based on your own situation and, if needed, consult a professional."}</p>`)}
 <p class="foot">${t("legal")}</p></div>`;
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
document.documentElement.lang=L;render();
</script>
</body>
